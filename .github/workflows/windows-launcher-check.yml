name: Windows launcher checks

on:
  pull_request:
    paths:
      - 'Start-Lab.cmd'
      - 'lab/windows/**'
      - '.github/workflows/windows-launcher-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inert-launcher-checks:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test launcher cache and report predicates in Windows PowerShell
        shell: powershell
        run: .\lab\windows\Test-Launcher.ps1
      - name: Test launcher cache and report predicates in PowerShell 7
        shell: pwsh
        run: ./lab/windows/Test-Launcher.ps1
      - name: Check Python runner source and help
        shell: pwsh
        run: |
          python -m py_compile lab/windows/run-cgi-regressions.py
          if ($LASTEXITCODE -ne 0) { throw "Python compile failed with exit code $LASTEXITCODE" }
          python lab/windows/run-cgi-regressions.py --help
          if ($LASTEXITCODE -ne 0) { throw "Python help check failed with exit code $LASTEXITCODE" }

  fresh-patched-launcher:
    needs: inert-launcher-checks
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download pinned runtimes and run patched checks on a fresh host
        shell: pwsh
        timeout-minutes: 15
        run: |
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File .\lab\windows\Start-Lab.ps1 -Mode patched -AcceptDownloads -NoOpen
          if ($LASTEXITCODE -ne 0) { throw "Guided patched run failed with exit code $LASTEXITCODE" }
          $directories = @(Get-ChildItem -LiteralPath lab/windows/runs -Directory)
          if ($directories.Count -ne 1) { throw "Expected one patched event in this fresh checkout; found $($directories.Count)" }
          $run = $directories[0]
          $receipt = Get-Content -LiteralPath (Join-Path $run.FullName 'receipt.json') -Raw | ConvertFrom-Json
          $cases = @($receipt.testCases)
          $expected = @(
            'ext/session/tests/rfc1867_incomplete_class_reserved_props.phpt',
            'ext/session/tests/rfc1867_no_user_code.phpt',
            'ext/session/tests/rfc1867_sid_invalid.phpt'
          )
          if ($receipt.runId -ne $run.Name -or $receipt.runtimeVersion -ne '8.5.12' -or
              $receipt.exitCode -ne 0 -or $receipt.selectedTestsPassed -ne $true -or
              $receipt.selectedIdentityMatch -ne $true -or $receipt.deadlineExceeded -ne $false -or
              $receipt.activeProcessesAfterCleanup -ne 0 -or $receipt.harnessError -or
              $receipt.junitParseError -or $cases.Count -ne $expected.Count -or
              @($cases | Where-Object { $_.relativePath -notin $expected -or
                  $_.failures -ne 0 -or $_.errors -ne 0 -or $_.skips -ne 0 -or $_.warnings -ne 0 }).Count -ne 0) {
            throw 'Fresh-host receipt failed selected identity, result or cleanup checks'
          }
          $report = Join-Path $run.FullName 'report.html'
          if (-not (Test-Path -LiteralPath $report -PathType Leaf) -or
              -not ((Get-Content -LiteralPath $report -Raw) -match 'Selected patched checks passed')) {
            throw 'Fresh-host plain-language report is missing or did not show the selected pass'
          }
          Write-Host "Fresh hosted Windows run verified: $($receipt.runId), PHP $($receipt.runtimeVersion), $($cases.Count) selected passes, zero owned processes after cleanup."
