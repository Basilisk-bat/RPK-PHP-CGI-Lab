name: PHP CGI cloud lab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selected-cgi-regressions:
    name: PHP ${{ matrix.version }} selected CGI regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '8.5.12'
            sha256: 81a0f450349e84b08eb43faa85f8a4c835684f3cc1c50471775d1317a046c525
          - version: '8.5.11'
            sha256: 338630ba9450f0b938bef8d740162c61c33bf64a1b421c6333c01df8a9fdb0ab
    env:
      PHP_VERSION: ${{ matrix.version }}
      PHP_SHA256: ${{ matrix.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Fetch and verify official source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cloud/build-context/src "cloud-results/$PHP_VERSION/host" "cloud-results/$PHP_VERSION/guest"
          python3 cloud/verify_source_manifest.py
          python3 cloud/test_evidence_boundary.py
          cp -R lab/windows/source/. cloud/build-context/src/
          cp cloud/run.sh cloud/build-context/run.sh
          curl --fail --location --proto '=https' --tlsv1.2 --retry 2 \
            "https://www.php.net/distributions/php-$PHP_VERSION.tar.gz" \
            -o cloud/build-context/php-source.tar.gz
          printf '%s  %s\n' "$PHP_SHA256" cloud/build-context/php-source.tar.gz | sha256sum -c -
          printf '%s\n' "$PHP_SHA256" > "cloud-results/$PHP_VERSION/host/source-archive-sha256.txt"

      - name: Build local image from verified source
        shell: bash
        run: |
          set -euo pipefail
          docker build --file cloud/Dockerfile --tag "rpk-php-cgi:$PHP_VERSION" cloud/build-context
          docker image inspect "rpk-php-cgi:$PHP_VERSION" --format '{{.Id}}' \
            > "cloud-results/$PHP_VERSION/host/image-id.txt"

      - name: Run selected tests with no container network
        shell: bash
        run: |
          set -euo pipefail
          event="github-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$PHP_VERSION"
          host="cloud-results/$PHP_VERSION/host"
          guest="cloud-results/$PHP_VERSION/guest"
          container="rpk-cgi-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$PHP_VERSION"
          sudo chown "10001:$(id -g)" "$guest"
          sudo chmod 2770 "$guest"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker create --name "$container" --network none --read-only \
            --memory 512m --pids-limit 64 --cpus 2 \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /work:rw,noexec,nosuid,nodev,size=128m,uid=10001,gid=10001,mode=0700 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777 \
            --mount "type=bind,src=$PWD/$guest,dst=/results" \
            "rpk-php-cgi:$PHP_VERSION" > "$host/container-id.txt"
          docker start "$container" > "$host/docker-start-output.txt"
          docker wait "$container" > "$host/docker-wait-exit.txt"
          set +o pipefail
          docker logs "$container" 2>&1 | head -c 65536 > "$host/docker-output.txt"
          log_status=${PIPESTATUS[0]}
          set -o pipefail
          printf '%s\n' "$log_status" > "$host/docker-logs-exit.txt"
          docker inspect "$container" --format \
            '{"networkMode":"{{.HostConfig.NetworkMode}}","readOnlyRootfs":{{.HostConfig.ReadonlyRootfs}},"memoryBytes":{{.HostConfig.Memory}},"pidsLimit":{{.HostConfig.PidsLimit}},"capDrop":{{json .HostConfig.CapDrop}},"capAdd":{{json .HostConfig.CapAdd}},"securityOpt":{{json .HostConfig.SecurityOpt}},"privileged":{{.HostConfig.Privileged}},"pidMode":"{{.HostConfig.PidMode}}","ipcMode":"{{.HostConfig.IpcMode}}","utsMode":"{{.HostConfig.UTSMode}}","user":"{{.Config.User}}","tmpfs":{{json .HostConfig.Tmpfs}},"mounts":{{json .Mounts}},"requestedMounts":{{json .HostConfig.Mounts}},"binds":{{json .HostConfig.Binds}},"volumesFrom":{{json .HostConfig.VolumesFrom}},"devices":{{json .HostConfig.Devices}},"running":{{.State.Running}},"oomKilled":{{.State.OOMKilled}},"exitCode":{{.State.ExitCode}}}' \
            > "$host/inspect.json"
          python3 cloud/summarize.py --version "$PHP_VERSION" --event "$event" --host "$host" --guest "$guest"

      - name: Show plain-language result
        if: always()
        shell: bash
        run: |
          report="cloud-results/$PHP_VERSION/host/report.md"
          if test -f "$report"; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '### PHP %s: no verified result report\n\nThe job stopped before creating a checked summary. Inspect the failing step; no comparison claim is established.\n' "$PHP_VERSION" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Emit bounded evidence in job log
        if: always()
        shell: bash
        run: |
          python3 cloud/emit_log_evidence.py --host "cloud-results/$PHP_VERSION/host" \
            --event "github-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$PHP_VERSION"

      - name: Save bounded run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: php-cgi-${{ matrix.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: cloud-results/${{ matrix.version }}/host/
          if-no-files-found: error
          retention-days: 14
